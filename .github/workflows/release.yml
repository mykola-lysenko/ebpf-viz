name: Release Standalone Tarball

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create/update releases and upload assets

jobs:
  build-and-release:
    name: Build standalone tarball and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run test suite
        run: pnpm test

      - name: Build standalone tarball
        run: bash build-standalone.sh

      - name: Set up Node.js 16 for runtime smoke
        uses: actions/setup-node@v5
        with:
          node-version: 16.20.2
          package-manager-cache: false

      - name: Audit standalone runtime dependencies
        working-directory: standalone
        run: npm audit --omit=dev

      - name: Smoke-test standalone runtime
        env:
          EXPECTED_NODE_MAJOR: '16'
        run: bash scripts/standalone-smoke.sh

      - name: Compute short SHA and timestamp
        id: meta
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
          package_version="$(node -e "process.stdout.write(require('./package.json').version)")"
          echo "package_version=${package_version}" >> $GITHUB_OUTPUT

      - name: Validate version tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="${{ steps.meta.outputs.package_version }}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${package_version}." >&2
            exit 1
          fi

      - name: Prepare versioned release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          notes_file="release-notes.md"

          awk -v version="$version" '
            BEGIN { capture = 0 }
            /^## \[/ {
              if (capture) exit
              capture = ($0 ~ "\\[" version "\\]")
            }
            capture { print }
          ' CHANGELOG.md > "$notes_file"

          if [ ! -s "$notes_file" ]; then
            cat > "$notes_file" <<NOTES
          ## ${tag}

          Built from commit \`${{ steps.meta.outputs.sha }}\`.
          NOTES
          fi

          cat >> "$notes_file" <<NOTES

          **Download:** \`ebpf-viz-standalone-${tag}.tar.gz\`

          **Quick start (requires Node.js ≥ 16.5):**
          \`\`\`bash
          tar -xzf ebpf-viz-standalone-${tag}.tar.gz
          cp standalone/.env.example standalone/.env
          ./standalone/start.sh --demo
          \`\`\`
          NOTES

      - name: Prepare versioned release asset
        if: startsWith(github.ref, 'refs/tags/v')
        run: cp ebpf-viz-standalone.tar.gz "ebpf-viz-standalone-${GITHUB_REF_NAME}.tar.gz"

      - name: Delete existing rolling release (if any)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true

      - name: Create rolling release and upload tarball
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "Latest build (${{ steps.meta.outputs.date }} · ${{ steps.meta.outputs.sha }})" \
            --notes "Automatically built from \`main\` at commit \`${{ steps.meta.outputs.sha }}\`.

          **Download:** \`ebpf-viz-standalone.tar.gz\`

          **Quick start (requires Node.js ≥ 16.5):**
          \`\`\`bash
          tar -xzf ebpf-viz-standalone.tar.gz
          cp standalone/.env.example standalone/.env
          # edit standalone/.env if needed
          ./standalone/start.sh --demo   # or omit --demo for live bpftool mode
          \`\`\`" \
            --prerelease \
            ebpf-viz-standalone.tar.gz

      - name: Create versioned release and upload tarball
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          asset="ebpf-viz-standalone-${tag}.tar.gz"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "eBPF Viz ${tag}" \
              --notes-file release-notes.md
          else
            gh release create "$tag" \
              --title "eBPF Viz ${tag}" \
              --notes-file release-notes.md
          fi

          gh release upload "$tag" "$asset" --clobber
